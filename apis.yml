aid: memverge
name: MemVerge
description: >-
  MemVerge is a memory and AI-infrastructure software company whose Memory Machine
  and Memory Machine Cloud (MMCloud) platforms virtualize and orchestrate memory and
  compute for AI, high-performance computing, and life-sciences workloads. MMCloud is
  operated through the OpCenter control plane and the first-party "float" command-line
  interface, which submits, migrates, checkpoints, and monitors containerized jobs
  across cloud and on-prem infrastructure, with spot-instance resiliency (SpotSurfer /
  WaveRider). MemVerge integrates with Nextflow, Snakemake, and Flyte through open-source
  plugins and SDKs published on its GitHub organization. Originally surfaced as a
  Lightspeed Venture Partners portfolio company, this profile is enriched from MemVerge's
  public documentation, CLI reference, and GitHub org.
